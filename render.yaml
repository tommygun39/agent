services:
  - type: web
    name: pandele-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ASSISTANT_NAME
        value: Pandele
      - key: DEFAULT_MODEL
        value: gemini-flash-latest
      - key: TZ
        value: Europe/Bucharest
      - key: GEMINI_API_KEY
        sync: false
